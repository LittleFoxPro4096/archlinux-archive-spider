# Arch Linux Archive mirror URL (ends with /repos)
# Official site: https://archive.archlinux.org/repos
# Other mirror: https://umea.archive.pkgbuild.com/repos
archive_url=https://archive.archlinux.org/repos

# Base URL where package files are stored (ends with /packages);
# derived automatically from archive_url if not set
#packages_url=https://archive.archlinux.org/packages

# Snapshot date, format YYYY/MM/DD
archive_date=2025/09/22

# Repo subdirectories (format: <repo>_url=<repo>/os/<arch>), add or remove as needed
# Note: the community repo was merged into extra
core_url=core/os/x86_64
multilib_url=multilib/os/x86_64
extra_url=extra/os/x86_64
#community_url=community/os/x86_64

# Also download .sig signature files (true/false)
with_sig=false
